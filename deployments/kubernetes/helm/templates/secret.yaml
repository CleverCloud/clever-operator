---
apiVersion: v1
kind: Secret
metadata:
{{ include "cleveroperator.namespace" . | indent 2 }}
  name: clever-kubernetes-operator-configuration
type: Opaque
stringData:
  config.toml: |
    [api]
    token = "{{ .Values.config.token }}"
    secret = "{{ .Values.config.secret }}"
    {{- if .Values.config.consumerKey }}
    consumer-key = "{{ .Values.config.consumerKey }}"
    {{- end }}
    {{- if .Values.config.consumerSecret }}
    consumer-secret = "{{ .Values.config.consumerSecret }}"
    {{- end }}
