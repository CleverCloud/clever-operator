---
apiVersion: apps/v1
kind: Deployment
metadata:
{{ include "cleveroperator.namespace" . | indent 2 }}
  name: clever-kubernetes-operator
  labels:
    app: clever-kubernetes-operator
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: clever-kubernetes-operator
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
    {{- if .Values.podAnnotations }}
        {{ toYaml .Values.podAnnotations | nindent 8 }}
    {{- end }}
      labels:
        app: clever-kubernetes-operator
    spec:
      serviceAccountName: clever-kubernetes-operator
      automountServiceAccountToken: true
      volumes:
      - name: config
        secret:
          secretName: clever-kubernetes-operator-configuration
          items:
          - key: "config.toml"
            path: "config.toml"
    {{- if .Values.config.caBundle }}
      # A sibling of the config volume rather than a path nested in it, so the
      # configuration directory stays exactly what the secret projects, and the
      # search path the operator scans holds no directory it does not own.
      - name: ca-bundle
        configMap:
          name: clever-kubernetes-operator-ca-bundle
          items:
          - key: "ca-bundle.pem"
            path: "ca-bundle.pem"
    {{- end }}
      containers:
        - image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          name: clever-kubernetes-operator
          command: ["/usr/local/bin/clever-kubernetes-operator"]
          args: ["-vvvvvvv"]
          volumeMounts:
          - name: config
            mountPath: "/etc/clever-kubernetes-operator"
            readOnly: true
        {{- if .Values.config.caBundle }}
          - name: ca-bundle
            mountPath: "/etc/clever-kubernetes-operator-ca"
            readOnly: true
        {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          ports:
            - containerPort: 8000
              protocol: TCP
              name: observability
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: observability
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 1
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
    {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
    {{- end }}
    {{- if .Values.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
    {{- end }}
    {{- if .Values.tolerations }}
      tolerations:
{{ toYaml .Values.tolerations | indent 8 }}
    {{- end }}
    {{- if .Values.affinity }}
      affinity:
{{ toYaml .Values.affinity | indent 8 }}
    {{- end }}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
