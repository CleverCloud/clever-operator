# Clever-Cloud api credentials
#
# We could use only the field token in the api section in the case,
# we are using the oauthless auth backend, like the example below.
#
# [api]
# token = ""
#
# In the case, we are using an oauth consumer group, the configuration does not change,
# we have three additional fields which are secret, consumer-key and consumer-secret.
#
# The endpoint is optional, it defaults to the public Clever Cloud api. Set it
# to target another installation.
#
# [api]
# endpoint = "https://api.clever-cloud.com"
#
# The ca_bundle is optional too. Set it to the path of a pem file holding the
# certificate authorities of a self-hosted installation served by a certificate
# signed by a private authority, they are trusted on top of the built-in ones.
#
# [api]
# ca_bundle = "/etc/clever-kubernetes-operator-ca/ca-bundle.pem"
[api]
token = ""
secret = ""
consumer-key = ""
consumer-secret = ""

# Operator settings
#
# For the moment, only the listen port is available.
[operator]
listen = "0.0.0.0:8000"
